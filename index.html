<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>praveen Admin Panel</title>    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">    <style>        :root {            --bg-body: #0f0f0f;            --primary-red: #e50914;            --card-bg: #1a1a1a;            --text-white: #ffffff;            --border: #333;        }        body {            background-color: var(--bg-body);            color: var(--text-white);            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;            margin: 0;            padding: 20px;        }        .container { max-width: 900px; margin: 0 auto; }        header {            display: flex;            justify-content: space-between;            align-items: center;            border-bottom: 2px solid var(--primary-red);            padding-bottom: 20px;            margin-bottom: 30px;        }        h1 { color: var(--primary-red); margin: 0; }        /* Tabs */        .tabs {            display: flex;            gap: 10px;            margin-bottom: 20px;        }        .tab-btn {            background: var(--card-bg);            border: 1px solid var(--border);            color: white;            padding: 10px 20px;            cursor: pointer;            border-radius: 4px;        }        .tab-btn.active {            background: var(--primary-red);            border-color: var(--primary-red);        }        /* Forms */        .admin-section {            background: var(--card-bg);            padding: 20px;            border-radius: 8px;            margin-bottom: 40px;            display: none;        }        .admin-section.active { display: block; }        .form-group {            display: grid;            grid-template-columns: 1fr 1fr;            gap: 15px;            margin-bottom: 20px;        }        input {            background: #222;            border: 1px solid var(--border);            padding: 12px;            color: white;            border-radius: 4px;            outline: none;        }        input:focus { border-color: var(--primary-red); }        .full-width { grid-column: span 2; }        .btn-add {            background: var(--primary-red);            color: white;            border: none;            padding: 12px 25px;            border-radius: 4px;            cursor: pointer;            font-weight: bold;            width: 100%;        }        /* Table Style List */        .data-list {            margin-top: 20px;            border-top: 1px solid var(--border);        }        .data-item {            display: flex;            align-items: center;            padding: 10px;            border-bottom: 1px solid var(--border);            gap: 15px;        }        .data-item img {            width: 50px;            height: 70px;            object-fit: cover;            border-radius: 4px;        }        .data-info { flex: 1; }        .data-info b { display: block; }        .data-info span { font-size: 12px; color: #888; }        .btn-delete {            background: none;            border: none;            color: #ff4444;            cursor: pointer;            font-size: 18px;        }        .toast {            position: fixed;            bottom: 20px; right: 20px;            background: #4BB543;            color: white;            padding: 10px 20px;            border-radius: 4px;            display: none;        }    </style></head><body>    <div class="container">        <header>            <h1>Krewflix Admin</h1>            <a href="index.html" style="color: #888; text-decoration: none;"><i class="fas fa-external-link-alt"></i> View App</a>        </header>        <div class="tabs">            <button class="tab-btn active" onclick="showTab('movies-section', this)">Movies</button>            <button class="tab-btn" onclick="showTab('series-section', this)">Series</button>            <button class="tab-btn" onclick="showTab('episodes-section', this)">Episodes</button>        </div>        <!-- MOVIES SECTION -->        <section id="movies-section" class="admin-section active">            <h3>Add New Movie</h3>            <div class="form-group">                <input type="text" id="m-title" placeholder="Movie Title" class="full-width">                <input type="text" id="m-poster" placeholder="Poster URL" class="full-width">                <input type="text" id="m-1080" placeholder="Link 1080p">                <input type="text" id="m-720" placeholder="Link 720p">                <input type="text" id="m-480" placeholder="Link 480p">            </div>            <button class="btn-add" onclick="addData('movies')">Add Movie</button>            <div class="data-list" id="list-movies"></div>        </section>        <!-- SERIES SECTION -->        <section id="series-section" class="admin-section">            <h3>Add New Series</h3>            <div class="form-group">                <input type="text" id="s-title" placeholder="Series Title">                <input type="number" id="s-num" placeholder="Series ID (Numeric)">                <input type="text" id="s-poster" placeholder="Poster URL" class="full-width">            </div>            <button class="btn-add" onclick="addData('series')">Add Series</button>            <div class="data-list" id="list-series"></div>        </section>        <!-- EPISODES SECTION -->        <section id="episodes-section" class="admin-section">            <h3>Add New Episode</h3>            <div class="form-group">                <input type="text" id="e-title" placeholder="Episode Title (e.g. S01 E01)">                <input type="number" id="e-seriesNum" placeholder="Series ID (Match with Series)">                <input type="text" id="e-poster" placeholder="Episode Poster URL (Optional)">                <input type="text" id="e-link" placeholder="Stream/Download Link">            </div>            <button class="btn-add" onclick="addData('episodes')">Add Episode</button>            <div class="data-list" id="list-episodes"></div>        </section>    </div>    <div id="toast" class="toast">Action Successful!</div>    <script type="module">        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";        import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";        // Same config as Main App        const firebaseConfig = {            apiKey: "AIzaSyDwBrtu-7-Nsf-IKMIXJqvw8SN-s-dQrN8",            authDomain: "rxpraveenbmi.firebaseapp.com",            databaseURL: "https://rxpraveenbmi-default-rtdb.firebaseio.com",            projectId: "rxpraveenbmi",            storageBucket: "rxpraveenbmi.firebasestorage.app",            messagingSenderId: "142511920854",            appId: "1:142511920854:web:62f0091860ccd4153f1b77",            measurementId: "G-4NFW2HZLXN"        };        const app = initializeApp(firebaseConfig);        const db = getDatabase(app);        // --- Tab Switching ---        window.showTab = (id, btn) => {            document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));            document.getElementById(id).classList.add('active');            btn.classList.add('active');        };        // --- Write Data ---        window.addData = (type) => {            let data = {};            let path = type;            if (type === 'movies') {                data = {                    title: document.getElementById('m-title').value,                    poster: document.getElementById('m-poster').value,                    link1080: document.getElementById('m-1080').value,                    link720: document.getElementById('m-720').value,                    link480: document.getElementById('m-480').value                };            } else if (type === 'series') {                data = {                    title: document.getElementById('s-title').value,                    poster: document.getElementById('s-poster').value,                    seriesNum: document.getElementById('s-num').value                };            } else if (type === 'episodes') {                data = {                    title: document.getElementById('e-title').value,                    seriesNum: document.getElementById('e-seriesNum').value,                    poster: document.getElementById('e-poster').value,                    link: document.getElementById('e-link').value                };            }            if (!data.title) return alert("Title is required!");            const newRef = push(ref(db, path));            set(newRef, data).then(() => {                showToast();                clearInputs();            });        };        // --- Delete Data ---        window.deleteItem = (path) => {            if (confirm("Are you sure you want to delete this?")) {                remove(ref(db, path)).then(() => showToast("Deleted!"));            }        };        // --- Read & Display ---        onValue(ref(db, '/'), (snapshot) => {            const data = snapshot.val() || {};                        renderList('list-movies', data.movies, 'movies');            renderList('list-series', data.series, 'series');            renderList('list-episodes', data.episodes, 'episodes');        });        function renderList(elementId, collection, path) {            const container = document.getElementById(elementId);            container.innerHTML = '';                        if (!collection) return;            Object.keys(collection).forEach(key => {                const item = collection[key];                const div = document.createElement('div');                div.className = 'data-item';                div.innerHTML = `                    <img src="${item.poster || 'https://via.placeholder.com/50x70?text=No+Img'}">                    <div class="data-info">                        <b>${item.title}</b>                        <span>${item.seriesNum ? 'ID: ' + item.seriesNum : 'Movie'}</span>                    </div>                    <button class="btn-delete" onclick="deleteItem('${path}/${key}')">                        <i class="fas fa-trash"></i>                    </button>                `;                container.appendChild(div);            });        }        // --- Helpers ---        function showToast(msg = "Success!") {            const t = document.getElementById('toast');            t.innerText = msg;            t.style.display = 'block';            setTimeout(() => t.style.display = 'none', 2000);        }        function clearInputs() {            document.querySelectorAll('input').forEach(i => i.value = '');        }    </script></body></html>
