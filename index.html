<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Admin Panel | praveen movie</title>    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">    <style>        :root {            --primary-red: #e50914;            --bg-dark: #080808;            --card-bg: #121212;            --input-bg: #1f1f1f;            --text-white: #ffffff;            --text-gray: #b3b3b3;        }        body {            background-color: var(--bg-dark);            color: var(--text-white);            font-family: 'Segoe UI', Roboto, sans-serif;            margin: 0;            padding: 20px;        }        .admin-container {            max-width: 900px;            margin: 0 auto;        }        header {            display: flex;            justify-content: space-between;            align-items: center;            border-bottom: 2px solid var(--card-bg);            padding-bottom: 20px;            margin-bottom: 30px;        }        .logo { color: var(--primary-red); font-weight: 900; font-size: 1.5rem; }        /* Tabs */        .tabs {            display: flex;            gap: 10px;            margin-bottom: 20px;            overflow-x: auto;            padding-bottom: 5px;        }        .tab-btn {            background: var(--card-bg);            color: var(--text-gray);            border: none;            padding: 10px 20px;            border-radius: 5px;            cursor: pointer;            white-space: nowrap;            transition: 0.3s;        }        .tab-btn.active {            background: var(--primary-red);            color: white;        }        /* Form Styling */        .form-section {            background: var(--card-bg);            padding: 25px;            border-radius: 10px;            display: none;        }        .form-section.active { display: block; }        .form-group { margin-bottom: 15px; }        label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-gray); }        input, textarea, select {            width: 100%;            padding: 12px;            background: var(--input-bg);            border: 1px solid #333;            color: white;            border-radius: 5px;            outline: none;        }        input:focus { border-color: var(--primary-red); }        button.submit-btn {            background: var(--primary-red);            color: white;            border: none;            padding: 15px;            width: 100%;            border-radius: 5px;            font-weight: bold;            cursor: pointer;            margin-top: 10px;        }        /* Data List */        .data-table {            margin-top: 40px;            width: 100%;            border-collapse: collapse;        }        .data-table th, .data-table td {            text-align: left;            padding: 12px;            border-bottom: 1px solid #222;        }        .data-table th { color: var(--text-gray); font-size: 0.8rem; text-transform: uppercase; }        .delete-btn {            background: none;            border: none;            color: #ff4444;            cursor: pointer;        }        /* Toast Notification */        #toast {            position: fixed;            bottom: 20px;            right: 20px;            padding: 15px 25px;            background: #2e7d32;            color: white;            border-radius: 5px;            display: none;            z-index: 1000;        }    </style></head><body>    <div class="admin-container">        <header>            <div class="logo">praveen movie <span style="color:white; font-size: 0.8rem; margin-left:10px;">ADMIN PANEL</span></div>            <a href="index.html" style="color: var(--text-gray); text-decoration: none;"><i class="fa-solid fa-eye"></i> View Site</a>        </header>        <div class="tabs">            <button class="tab-btn active" onclick="showTab('movie-form', this)">Add Movie</button>            <button class="tab-btn" onclick="showTab('series-form', this)">Add Series</button>            <button class="tab-btn" onclick="showTab('episode-form', this)">Add Episode</button>            <button class="tab-btn" onclick="showTab('manage-data', this)" id="manage-tab-btn">Manage Data</button>        </div>        <!-- Movie Form -->        <section id="movie-form" class="form-section active">            <h2>Add New Movie</h2>            <form id="f-movie">                <div class="form-group">                    <label>Movie Title</label>                    <input type="text" id="m-title" required placeholder="e.g. Interstellar">                </div>                <div class="form-group">                    <label>Poster URL</label>                    <input type="url" id="m-poster" required placeholder="https://image-link.jpg">                </div>                <div class="form-group">                    <label>Description</label>                    <textarea id="m-desc" rows="3"></textarea>                </div>                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">                    <div class="form-group"><label>1080p Link</label><input type="text" id="m-1080"></div>                    <div class="form-group"><label>720p Link</label><input type="text" id="m-720"></div>                    <div class="form-group"><label>480p Link</label><input type="text" id="m-480"></div>                </div>                <button type="submit" class="submit-btn">UPLOAD MOVIE</button>            </form>        </section>        <!-- Series Form -->        <section id="series-form" class="form-section">            <h2>Add New Series</h2>            <form id="f-series">                <div class="form-group">                    <label>Series Title</label>                    <input type="text" id="s-title" required>                </div>                <div class="form-group">                    <label>Series Number (Unique ID)</label>                    <input type="number" id="s-num" required placeholder="e.g. 101">                </div>                <div class="form-group">                    <label>Poster URL</label>                    <input type="url" id="s-poster" required>                </div>                <div class="form-group">                    <label>Description</label>                    <textarea id="s-desc" rows="3"></textarea>                </div>                <button type="submit" class="submit-btn">CREATE SERIES</button>            </form>        </section>        <!-- Episode Form -->        <section id="episode-form" class="form-section">            <h2>Add Episode</h2>            <form id="f-episode">                <div class="form-group">                    <label>Parent Series Number</label>                    <input type="number" id="e-snum" required placeholder="Must match Series ID">                </div>                <div class="form-group">                    <label>Episode Title</label>                    <input type="text" id="e-title" required placeholder="e.g. Episode 1: The Beginning">                </div>                <div class="form-group">                    <label>Episode Number</label>                    <input type="number" id="e-num" required>                </div>                <div class="form-group">                    <label>Episode Poster (Optional)</label>                    <input type="url" id="e-poster">                </div>                <div class="form-group">                    <label>Play Link</label>                    <input type="text" id="e-link" required>                </div>                <button type="submit" class="submit-btn">ADD EPISODE</button>            </form>        </section>        <!-- Manage Data Section -->        <section id="manage-data" class="form-section">            <h2>Manage Content</h2>            <table class="data-table">                <thead>                    <tr>                        <th>Type</th>                        <th>Title</th>                        <th>ID/Num</th>                        <th>Action</th>                    </tr>                </thead>                <tbody id="data-list-body">                    <!-- Items injected by JS -->                </tbody>            </table>        </section>    </div>    <div id="toast">Data saved successfully!</div>    <script type="module">        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";        import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";        const firebaseConfig = {            apiKey: "AIzaSyDwBrtu-7-Nsf-IKMIXJqvw8SN-s-dQrN8",            authDomain: "rxpraveenbmi.firebaseapp.com",            databaseURL: "https://rxpraveenbmi-default-rtdb.firebaseio.com",            projectId: "rxpraveenbmi",            storageBucket: "rxpraveenbmi.firebasestorage.app",            messagingSenderId: "142511920854",            appId: "1:142511920854:web:62f0091860ccd4153f1b77"        };        const app = initializeApp(firebaseConfig);        const db = getDatabase(app);        // --- Tab Switching ---        window.showTab = (tabId, btn) => {            document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));            document.getElementById(tabId).classList.add('active');            btn.classList.add('active');            if(tabId === 'manage-data') loadManagementData();        };        function showToast(msg) {            const t = document.getElementById('toast');            t.innerText = msg;            t.style.display = 'block';            setTimeout(() => t.style.display = 'none', 3000);        }        // --- Add Movie ---        document.getElementById('f-movie').onsubmit = async (e) => {            e.preventDefault();            const data = {                title: document.getElementById('m-title').value,                poster: document.getElementById('m-poster').value,                description: document.getElementById('m-desc').value,                link1080: document.getElementById('m-1080').value,                link720: document.getElementById('m-720').value,                link480: document.getElementById('m-480').value,                type: 'movie',                timestamp: Date.now()            };            await push(ref(db, 'movies'), data);            showToast("Movie Added!");            e.target.reset();        };        // --- Add Series ---        document.getElementById('f-series').onsubmit = async (e) => {            e.preventDefault();            const data = {                title: document.getElementById('s-title').value,                seriesNum: document.getElementById('s-num').value,                poster: document.getElementById('s-poster').value,                description: document.getElementById('s-desc').value,                type: 'series',                timestamp: Date.now()            };            await push(ref(db, 'series'), data);            showToast("Series Created!");            e.target.reset();        };        // --- Add Episode ---        document.getElementById('f-episode').onsubmit = async (e) => {            e.preventDefault();            const data = {                seriesNum: document.getElementById('e-snum').value,                title: document.getElementById('e-title').value,                epNum: document.getElementById('e-num').value,                poster: document.getElementById('e-poster').value,                link: document.getElementById('e-link').value,                type: 'episode'            };            await push(ref(db, 'episodes'), data);            showToast("Episode Linked!");            e.target.reset();        };        // --- Management Logic ---        function loadManagementData() {            const listBody = document.getElementById('data-list-body');            onValue(ref(db, '/'), (snapshot) => {                const data = snapshot.val();                listBody.innerHTML = '';                if(!data) return;                ['movies', 'series', 'episodes'].forEach(category => {                    if(data[category]) {                        Object.entries(data[category]).forEach(([key, val]) => {                            const tr = document.createElement('tr');                            tr.innerHTML = `                                <td><small>${category.toUpperCase()}</small></td>                                <td>${val.title}</td>                                <td>${val.seriesNum || '-'}</td>                                <td><button class="delete-btn" onclick="deleteItem('${category}', '${key}')"><i class="fa-solid fa-trash"></i></button></td>                            `;                            listBody.appendChild(tr);                        });                    }                });            });        }        window.deleteItem = async (cat, key) => {            if(confirm("Are you sure you want to delete this?")) {                await remove(ref(db, `${cat}/${key}`));                showToast("Item deleted");            }        };    </script></body></html>
