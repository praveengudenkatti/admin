<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #141414;
            --bg-secondary: #1f1f1f;
            --bg-card: #2a2a2a;
            --text-primary: #e5e5e5;
            --text-secondary: #999;
            --accent: #e50914;
            --accent-hover: #f40612;
            --border: #404040;
            --shadow: rgba(0, 0, 0, 0.5);
        }

        body.light-mode {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #141414;
            --text-secondary: #555;
            --accent: #e50914;
            --accent-hover: #f40612;
            --border: #e0e0e0;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            gap: 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Auth Section */
        #auth-section {
            display: none;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px var(--shadow);
        }

        .auth-card h1 {
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(229, 9, 20, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg-secondary);
            box-shadow: 0 4px 12px var(--shadow);
        }

        /* Dashboard */
        #dashboard {
            display: none;
        }

        header {
            background: var(--bg-secondary);
            padding: 20px;
            box-shadow: 0 2px 8px var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-content h1 {
            font-size: 24px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .theme-toggle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--bg-card);
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            background: var(--border);
            transform: rotate(180deg);
        }

        .btn-logout {
            padding: 10px 20px;
            width: auto;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .section {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 16px var(--shadow);
        }

        .section h2 {
            margin-bottom: 20px;
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
            font-family: inherit;
        }

        .movie-list {
            display: grid;
            gap: 15px;
        }

        .movie-item {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
            border: 1px solid var(--border);
            transition: all 0.3s;
        }

        .movie-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--shadow);
        }

        .movie-poster {
            width: 80px;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .movie-info {
            flex: 1;
        }

        .movie-info h3 {
            margin-bottom: 8px;
            font-size: 18px;
        }

        .movie-info p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 5px;
        }

        .movie-links {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .link-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .link-badge.download {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
            border: 1px solid #4caf50;
        }

        .link-badge.play {
            background: rgba(33, 150, 243, 0.2);
            color: #2196f3;
            border: 1px solid #2196f3;
        }

        .movie-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 14px;
            width: auto;
        }

        .btn-edit {
            background: #4caf50;
        }

        .btn-edit:hover {
            background: #45a049;
        }

        .btn-delete {
            background: #f44336;
        }

        .btn-delete:hover {
            background: #da190b;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 16px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .report-item {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
            margin-bottom: 15px;
        }

        .report-item h4 {
            margin-bottom: 10px;
            color: var(--accent);
        }

        .report-item p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 5px;
        }

        .btn-resolve {
            background: #2196f3;
            margin-top: 10px;
        }

        .btn-resolve:hover {
            background: #0b7dda;
        }

        .success-message, .error-message {
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
            color: #4caf50;
        }

        .error-message {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            color: #f44336;
        }

        .info-text {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        @media (max-width: 768px) {
            .movie-item {
                flex-direction: column;
                text-align: center;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <p class="loading-text">Firebase se connect ho raha hai...</p>
    </div>

    <!-- Auth Section -->
    <div id="auth-section">
        <div class="auth-card">
            <h1><i class="fas fa-film"></i> Admin Login</h1>
            <div id="auth-message" class="error-message"></div>
            <form id="login-form">
                <div class="input-group">
                    <label for="auth-email">Email</label>
                    <input type="email" id="auth-email" placeholder="admin@example.com" required>
                </div>
                <div class="input-group">
                    <label for="auth-password">Password</label>
                    <input type="password" id="auth-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn" id="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard">
        <header>
            <div class="header-content">
                <h1><i class="fas fa-film"></i> Movie Admin Panel</h1>
                <div class="header-actions">
                    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme">
                        <i class="fas fa-moon"></i>
                    </button>
                    <button class="btn btn-logout btn-small" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </div>
        </header>

        <main>
            <!-- Add Movie Section -->
            <section class="section">
                <h2><i class="fas fa-plus-circle"></i> <span id="form-title">Add New Movie</span></h2>
                <div id="form-message" class="success-message"></div>
                <form id="movie-form">
                    <input type="hidden" id="edit-movie-id">
                    <div class="form-row">
                        <div class="input-group">
                            <label for="movie-title">Movie Title *</label>
                            <input type="text" id="movie-title" placeholder="Enter movie title" required>
                        </div>
                        <div class="input-group">
                            <label for="movie-genre">Genre *</label>
                            <select id="movie-genre" required>
                                <option value="">Select Genre</option>
                                <option value="Action">Action</option>
                                <option value="Comedy">Comedy</option>
                                <option value="Drama">Drama</option>
                                <option value="Horror">Horror</option>
                                <option value="Sci-Fi">Sci-Fi</option>
                                <option value="Romance">Romance</option>
                                <option value="Thriller">Thriller</option>
                                <option value="Animation">Animation</option>
                                <option value="Adventure">Adventure</option>
                                <option value="Fantasy">Fantasy</option>
                            </select>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="movie-poster">Poster Image URL *</label>
                        <input type="url" id="movie-poster" placeholder="https://example.com/poster.jpg" required>
                        <p class="info-text"><i class="fas fa-info-circle"></i> Direct image link (must end with .jpg, .png, etc.)</p>
                    </div>
                    <div class="input-group">
                        <label for="movie-play">Play Online URL *</label>
                        <input type="url" id="movie-play" placeholder="https://example.com/play/movie" required>
                        <p class="info-text"><i class="fas fa-play-circle"></i> Link to watch movie online (streaming URL)</p>
                    </div>
                    <div class="input-group">
                        <label for="movie-download">Download URL *</label>
                        <input type="url" id="movie-download" placeholder="https://example.com/download/movie.mp4" required>
                        <p class="info-text"><i class="fas fa-download"></i> Direct download link for movie file</p>
                    </div>
                    <div class="input-group">
                        <label for="movie-description">Description *</label>
                        <textarea id="movie-description" placeholder="Enter movie description" required></textarea>
                    </div>
                    <button type="submit" class="btn">
                        <i class="fas fa-save"></i> <span id="submit-text">Add Movie</span>
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="cancelEdit()" id="cancel-btn" style="display:none; margin-top:10px;">
                        <i class="fas fa-times"></i> Cancel Edit
                    </button>
                </form>
            </section>

            <!-- Manage Movies Section -->
            <section class="section">
                <h2><i class="fas fa-list"></i> Manage Movies</h2>
                <div class="search-box">
                    <input type="text" id="search-movies" placeholder="🔍 Search movies by title or genre..." oninput="searchMovies()">
                </div>
                <div id="movies-list" class="movie-list">
                    <div class="empty-state">
                        <i class="fas fa-film"></i>
                        <p>Loading movies...</p>
                    </div>
                </div>
            </section>

            <!-- Reports Section -->
            <section class="section">
                <h2><i class="fas fa-exclamation-triangle"></i> Broken Link Reports</h2>
                <div id="reports-list">
                    <div class="empty-state">
                        <i class="fas fa-check-circle"></i>
                        <p>No reports yet</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // ==================== FIREBASE CONFIGURATION ====================
        // TODO: Replace with your Firebase project configuration
        const firebaseConfig = {
  apiKey: "AIzaSyCgd6_Vw_QVGHX_SxtFxtSrYhsD6fLR3HA",
  authDomain: "movieo-app.firebaseapp.com",
  databaseURL: "https://movieo-app-default-rtdb.firebaseio.com",
  projectId: "movieo-app",
  storageBucket: "movieo-app.firebasestorage.app",
  messagingSenderId: "1007959886470",
  appId: "1:1007959886470:web:43103b6d7e9a28eddd9f07",
  measurementId: "G-VCP2LNSTQ5"
};

        // Global variables
        let auth, database;
        let allMovies = [];
        let isInitialized = false;

        // ==================== INITIALIZATION ====================
        function initializeFirebase() {
            try {
                firebase.initializeApp(firebaseConfig);
                auth = firebase.auth();
                database = firebase.database();
                
                console.log('Firebase initialized successfully');
                isInitialized = true;
                setupAuthListener();
            } catch (error) {
                console.error('Firebase initialization error:', error);
                hideLoading();
                showMessage('auth-message', 'Firebase configuration error. Please check your config.', 'error');
                document.getElementById('auth-section').style.display = 'flex';
            }
        }

        // ==================== AUTH STATE MANAGEMENT ====================
        function setupAuthListener() {
            auth.onAuthStateChanged((user) => {
                console.log('Auth state changed:', user ? 'User logged in' : 'No user');
                
                if (user) {
                    showDashboard();
                } else {
                    showLoginPage();
                }
                
                hideLoading();
            });
        }

        function showLoginPage() {
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('auth-section').style.display = 'flex';
        }

        function showDashboard() {
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            loadMovies();
            loadReports();
        }

        function hideLoading() {
            setTimeout(() => {
                document.getElementById('loading-screen').style.display = 'none';
            }, 500);
        }

        // ==================== AUTH FUNCTIONS ====================
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            login();
        });

        function login() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            const loginBtn = document.getElementById('login-btn');

            if (!email || !password) {
                showMessage('auth-message', 'Please enter both email and password', 'error');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';

            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    console.log('Login successful');
                })
                .catch((error) => {
                    console.error('Login error:', error);
                    showMessage('auth-message', error.message, 'error');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
                });
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                auth.signOut().then(() => {
                    console.log('Logged out successfully');
                    location.reload();
                }).catch((error) => {
                    alert('Error logging out: ' + error.message);
                });
            }
        }

        // ==================== THEME MANAGEMENT ====================
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const icon = document.querySelector('.theme-toggle i');
            if (icon) {
                icon.className = document.body.classList.contains('light-mode') ? 'fas fa-sun' : 'fas fa-moon';
            }
        }

        function loadTheme() {
            const theme = localStorage.getItem('theme');
            if (theme === 'light') {
                document.body.classList.add('light-mode');
            }
            updateThemeIcon();
        }

        // ==================== UI HELPERS ====================
        function showMessage(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = type === 'error' ? 'error-message' : 'success-message';
            element.style.display = 'block';
            setTimeout(() => {
                element.style.display = 'none';
            }, 5000);
        }

        // ==================== MOVIE CRUD OPERATIONS ====================
        document.getElementById('movie-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const movieData = {
                title: document.getElementById('movie-title').value.trim(),
                genre: document.getElementById('movie-genre').value,
                poster: document.getElementById('movie-poster').value.trim(),
                playUrl: document.getElementById('movie-play').value.trim(),
                downloadUrl: document.getElementById('movie-download').value.trim(),
                description: document.getElementById('movie-description').value.trim(),
                timestamp: Date.now(),
                ratingTotal: 0,
                ratingCount: 0
            };

            const editId = document.getElementById('edit-movie-id').value;

            if (editId) {
                database.ref('movies/' + editId).update(movieData)
                    .then(() => {
                        showMessage('form-message', 'Movie updated successfully!', 'success');
                        cancelEdit();
                    })
                    .catch((error) => {
                        showMessage('form-message', 'Error: ' + error.message, 'error');
                    });
            } else {
                database.ref('movies').push(movieData)
                    .then(() => {
                        showMessage('form-message', 'Movie added successfully!', 'success');
                        document.getElementById('movie-form').reset();
                    })
                    .catch((error) => {
                        showMessage('form-message', 'Error: ' + error.message, 'error');
                    });
            }
        });

        function loadMovies() {
            database.ref('movies').on('value', (snapshot) => {
                allMovies = [];
                const moviesList = document.getElementById('movies-list');
                moviesList.innerHTML = '';

                if (!snapshot.exists()) {
                    moviesList.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-film"></i>
                            <p>No movies yet. Add your first movie!</p>
                        </div>
                    `;
                    return;
                }

                snapshot.forEach((childSnapshot) => {
                    const movie = childSnapshot.val();
                    movie.id = childSnapshot.key;
                    allMovies.push(movie);
                });

                displayMovies(allMovies);
            });
        }

        function displayMovies(movies) {
            const moviesList = document.getElementById('movies-list');
            moviesList.innerHTML = '';

            if (movies.length === 0) {
                moviesList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <p>No movies found</p>
                    </div>
                `;
                return;
            }

            movies.forEach(movie => {
                const avgRating = movie.ratingCount > 0 ? (movie.ratingTotal / movie.ratingCount).toFixed(1) : 'N/A';
                const movieItem = document.createElement('div');
                movieItem.className = 'movie-item';
                movieItem.innerHTML = `
                    <img src="${movie.poster}" alt="${movie.title}" class="movie-poster" onerror="this.src='https://via.placeholder.com/80x120?text=No+Image'">
                    <div class="movie-info">
                        <h3>${movie.title}</h3>
                        <p><strong>Genre:</strong> ${movie.genre}</p>
                        <p><strong>Rating:</strong> ⭐ ${avgRating} (${movie.ratingCount} votes)</p>
                        <div class="movie-links">
                            <span class="link-badge play"><i class="fas fa-play-circle"></i> Play Link</span>
                            <span class="link-badge download"><i class="fas fa-download"></i> Download Link</span>
                        </div>
                        <p style="margin-top:8px;">${movie.description.substring(0, 100)}${movie.description.length > 100 ? '...' : ''}</p>
                    </div>
                    <div class="movie-actions">
                        <button class="btn btn-small btn-edit" onclick="editMovie('${movie.id}')">
                            <i class="fas fa-edit"></i> Edit
                        </button>
                        <button class="btn btn-small btn-delete" onclick="deleteMovie('${movie.id}', '${movie.title.replace(/'/g, "\\'")}')">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </div>
                `;
                moviesList.appendChild(movieItem);
            });
        }

        function searchMovies() {
            const searchTerm = document.getElementById('search-movies').value.toLowerCase();
            const filtered = allMovies.filter(movie => 
                movie.title.toLowerCase().includes(searchTerm) || 
                movie.genre.toLowerCase().includes(searchTerm)
            );
            displayMovies(filtered);
        }

        function editMovie(movieId) {
            const movie = allMovies.find(m => m.id === movieId);
            if (!movie) return;

            document.getElementById('edit-movie-id').value = movieId;
            document.getElementById('movie-title').value = movie.title;
            document.getElementById('movie-genre').value = movie.genre;
            document.getElementById('movie-poster').value = movie.poster;
            document.getElementById('movie-play').value = movie.playUrl || '';
            document.getElementById('movie-download').value = movie.downloadUrl;
            document.getElementById('movie-description').value = movie.description;

            document.getElementById('form-title').textContent = 'Edit Movie';
            document.getElementById('submit-text').textContent = 'Update Movie';
            document.getElementById('cancel-btn').style.display = 'block';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            document.getElementById('movie-form').reset();
            document.getElementById('edit-movie-id').value = '';
            document.getElementById('form-title').textContent = 'Add New Movie';
            document.getElementById('submit-text').textContent = 'Add Movie';
            document.getElementById('cancel-btn').style.display = 'none';
        }

        function deleteMovie(movieId, title) {
            if (confirm(`Are you sure you want to delete "${title}"?`)) {
                database.ref('movies/' + movieId).remove()
                    .then(() => {
                        showMessage('form-message', 'Movie deleted successfully!', 'success');
                    })
                    .catch((error) => {
                        showMessage('form-message', 'Error: ' + error.message, 'error');
                    });
            }
        }

        // ==================== REPORTS MANAGEMENT ====================
        function loadReports() {
            database.ref('reports').on('value', (snapshot) => {
                const reportsList = document.getElementById('reports-list');
                reportsList.innerHTML = '';

                if (!snapshot.exists()) {
                    reportsList.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-check-circle"></i>
                            <p>No reports yet</p>
                        </div>
                    `;
                    return;
                }

                snapshot.forEach((childSnapshot) => {
                    const report = childSnapshot.val();
                    const reportId = childSnapshot.key;
                    const reportItem = document.createElement('div');
                    reportItem.className = 'report-item';
                    reportItem.innerHTML = `
                        <h4>${report.movieTitle}</h4>
                        <p><strong>Movie ID:</strong> ${report.movieId}</p>
                        <p><strong>Reported:</strong> ${new Date(report.timestamp).toLocaleString()}</p>
                        <p><strong>User ID:</strong> ${report.userId || 'Anonymous'}</p>
                        <button class="btn btn-small btn-resolve" onclick="resolveReport('${reportId}')">
                            <i class="fas fa-check"></i> Resolve
                        </button>
                    `;
                    reportsList.appendChild(reportItem);
                });
            });
        }

        function resolveReport(reportId) {
            if (confirm('Mark this report as resolved?')) {
                database.ref('reports/' + reportId).remove()
                    .catch((error) => {
                        alert('Error: ' + error.message);
                    });
            }
        }

        // ==================== PAGE LOAD ====================
        window.addEventListener('DOMContentLoaded', () => {
            console.log('Page loaded, initializing...');
            loadTheme();
            initializeFirebase();
        });

        document.getElementById('auth-password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                login();
            }
        });
    </script>
</body>
</html>
